<div class="card p-3 shadow-sm">
  <div class="d-flex align-items-center justify-content-between">
    <h5 class="mb-0">Units</h5>
    <span *ngIf="loading" class="text-muted">Loading…</span>
  </div>

  <div *ngIf="error" class="alert alert-danger my-2">{{ error }}</div>

  <!-- Add row -->
  <div class="row g-2 my-3">
    <div class="col-3">
      <input class="form-control" placeholder="Symbol (e.g. g/dL)" [(ngModel)]="newSymbol" />
    </div>
    <div class="col-5">
      <input class="form-control" placeholder="Name (optional)" [(ngModel)]="newName" />
    </div>
    <div class="col">
      <button class="btn btn-primary" (click)="add()">Add</button>
    </div>
  </div>

  <!-- Table -->
  <table class="table table-sm table-striped align-middle">
    <thead>
      <tr>
        <th style="width: 100px">ID</th>
        <th style="width: 200px">Symbol</th>
        <th>Name</th>
        <th style="width: 110px">Active</th>
        <th style="width: 200px">Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let u of units">
        <td>{{ u.id }}</td>

        <!-- symbol -->
        <td *ngIf="editId !== u.id">{{ u.symbol }}</td>
        <td *ngIf="editId === u.id">
          <input class="form-control form-control-sm" [(ngModel)]="editSymbol" />
        </td>

        <!-- name -->
        <td *ngIf="editId !== u.id">{{ u.name }}</td>
        <td *ngIf="editId === u.id">
          <input class="form-control form-control-sm" [(ngModel)]="editName" />
        </td>

        <!-- active -->
        <td *ngIf="editId !== u.id">{{ u.isActive ? '✅' : '❌' }}</td>
        <td *ngIf="editId === u.id">
          <input
            class="form-check-input"
            type="checkbox"
            [(ngModel)]="editActive"
            id="chk{{ u.id }}"
          />
          <label class="form-check-label ms-1" for="chk{{ u.id }}">Active</label>
        </td>

        <td>
          <ng-container *ngIf="editId !== u.id; else editing">
            <button class="btn btn-sm btn-outline-secondary me-2" (click)="startEdit(u)">
              Edit
            </button>
            <button class="btn btn-sm btn-outline-warning" (click)="toggle(u)">
              {{ u.isActive ? 'Deactivate' : 'Activate' }}
            </button>
          </ng-container>
          <ng-template #editing>
            <button class="btn btn-sm btn-primary me-2" (click)="saveEdit(u.id)">Save</button>
            <button class="btn btn-sm btn-secondary" (click)="cancelEdit()">Cancel</button>
          </ng-template>
        </td>
      </tr>
    </tbody>
  </table>
</div>
